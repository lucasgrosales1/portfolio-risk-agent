# WealthSync Advisors theme — dark "AI Finance" clone (near-black navy,
# sky-blue accent). Drives native widgets CSS can't reach (dataframes,
# glide-data-grid canvas cells) — must stay in sync with app_ui.py's palette.
[theme]
base = "dark"
primaryColor = "#7DB2F5"
backgroundColor = "#05061C"
secondaryBackgroundColor = "#0B0C2E"
textColor = "#FFFFFF"
font = "sans serif"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
